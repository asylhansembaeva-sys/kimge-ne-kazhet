const stages=[{"title": "Шашын тарап тұрған қыз", "question": "Қызға қандай заттар қажет?", "hero": "assets/stage1_28.webp", "items": [{"src": "assets/stage1_38.webp", "label": "Тарақ", "correct": true, "id": 0}, {"src": "assets/stage1_4.webp", "label": "Айна", "correct": true, "id": 1}, {"src": "assets/stage1_37.webp", "label": "Шаш қыстырғыш", "correct": true, "id": 2}, {"src": "assets/stage1_22.webp", "label": "Шаш резеңкесі", "correct": true, "id": 3}, {"src": "assets/stage1_35.webp", "label": "Доп", "correct": false, "id": 4}, {"src": "assets/stage1_17.webp", "label": "Тіс щеткасы", "correct": false, "id": 5}]}, {"title": "Тісін тазалап тұрған бала", "question": "Балаға қандай заттар қажет?", "hero": "assets/stage2_30.webp", "items": [{"src": "assets/stage2_17.webp", "label": "Тіс щеткасы", "correct": true, "id": 0}, {"src": "assets/stage2_13.webp", "label": "Тіс пастасы", "correct": true, "id": 1}, {"src": "assets/stage2_40.webp", "label": "Стақан", "correct": true, "id": 2}, {"src": "assets/stage2_33.webp", "label": "Сүлгі", "correct": true, "id": 3}, {"src": "assets/stage2_27.webp", "label": "Циркуль", "correct": false, "id": 4}, {"src": "assets/stage2_11.webp", "label": "Маска", "correct": false, "id": 5}]}, {"title": "Сурет салып отырған бала", "question": "Сурет салуға не қажет?", "hero": "assets/stage3_25.webp", "items": [{"src": "assets/stage3_9.webp", "label": "Қарындаш", "correct": true, "id": 0}, {"src": "assets/stage3_41.webp", "label": "Бояу", "correct": true, "id": 1}, {"src": "assets/stage3_0.webp", "label": "Қылқалам", "correct": true, "id": 2}, {"src": "assets/stage3_8.webp", "label": "Сурет альбомы", "correct": true, "id": 3}, {"src": "assets/stage3_7.webp", "label": "Ойыншық машина", "correct": false, "id": 4}, {"src": "assets/stage3_18.webp", "label": "Тіс щеткасы", "correct": false, "id": 5}]}, {"title": "Дәрігер", "question": "Дәрігерге қандай заттар қажет?", "hero": "assets/stage4_2.webp", "items": [{"src": "assets/stage4_3.webp", "label" function sound(ok=true){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();let now=audioCtx.currentTime;let notes=ok?[523,659,784,1046]:[240,180];notes.forEach((freq,i)=>{let osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=ok?'sine':'triangle';osc.frequency.setValueAtTime(freq,now+i*.105);gain.gain.setValueAtTime(.0001,now+i*.105);gain.gain.exponentialRampToValueAtTime(.13,now+i*.105+.012);gain.gain.exponentialRampToValueAtTime(.0001,now+i*.105+.20);osc.connect(gain).connect(audioCtx.destination);osc.start(now+i*.105);osc.stop(now+i*.105+.21)})}catch(e){}}

function choose(item,el){if(picked[stage].includes(item.id))return;if(!item.correct){sound(false);el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),450);return}picked[stage].push(item.id);sound(true);fireworks();render(false);if(picked[stage].length===4){finished.add(stage);showText('🎉 ЖАРАЙСЫҢ! 🎉');sound(true);render(false);clearTimeout(advanceTimer);advanceTimer=setTimeout(()=>{if(stage<stages.length-1)go(stage+1);else showText('🏆 ӨТЕ ЖАҚСЫ! 🏆')},1900)}else showText('🌟 ДҰРЫС! 🌟')}
function go(i){clearTimeout(advanceTimer);stage=(i+stages.length)%stages.length;render()};$('prev').onclick=()=>go(stage-1);$('next').onclick=()=>go(stage+1);$('restart').onclick=()=>{clearTimeout(advanceTimer);picked[stage]=[];finished.delete(stage);render();$('status').textContent='🔄 Кезең қайта басталды!'};$('target').ondragover=e=>e.preventDefault();$('target').ondrop=e=>{e.preventDefault();let id=Number(e.dataTransfer.getData('text/plain'));let item=stages[stage].items.find(v=>v.id===id);if(item)choose(item,$('items').children[order.findIndex(v=>v.id===id)])};render();
